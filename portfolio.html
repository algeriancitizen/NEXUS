<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b1220"/>
<title>Nexus — Portfolio</title>
<meta name="description" content="Nexus Portfolio — أعمال وخدمات Nexus."/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1220; --bg2:#0f172a;
  --t:#eaf0ff; --m:rgba(234,240,255,.72);
  --line:rgba(255,255,255,.12);
  --g:#22c55e; --c:#06b6d4; --w:#f59e0b;
  --sh:0 18px 55px rgba(0,0,0,.45);
  --r:22px; --r2:18px; --max:1180px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{
  margin:0;font-family:Cairo,system-ui;color:var(--t);
  background:
    radial-gradient(900px 420px at 12% 8%, rgba(34,197,94,.20), transparent 60%),
    radial-gradient(900px 420px at 88% 0%, rgba(6,182,212,.20), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  overflow-x:hidden
}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 18px}

/* Topbar (same style) */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(11,18,32,.62);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.logoWrap{padding:7px;border-radius:18px;background:linear-gradient(135deg, rgba(34,197,94,.95), rgba(6,182,212,.95));box-shadow:0 18px 40px rgba(6,182,212,.20)}
.logo{width:46px;height:46px;object-fit:contain;border-radius:14px;padding:6px;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.22)}
.pill{padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--m);font-weight:900;font-size:14px;transition:.2s}
.pill:hover{background:rgba(255,255,255,.08);transform:translateY(-1px);color:var(--t)}
.btn{padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:900;transition:.2s}
.btn:hover{background:rgba(255,255,255,.10);transform:translateY(-1px)}
.btnPrimary{border:0;background:linear-gradient(135deg,#34d399,#22c55e);color:#062012;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.btnCall{border:0;background:linear-gradient(135deg,rgba(6,182,212,.95),rgba(34,197,94,.95));color:#071019;box-shadow:0 10px 30px rgba(0,0,0,.18)}

/* Hero */
.hero{margin:34px 0 12px;border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.05);box-shadow:var(--sh);padding:22px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-160px -160px auto auto;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(6,182,212,.35),rgba(6,182,212,0) 60%)}
h1{margin:0 0 8px;font-size:clamp(28px,3.2vw,44px);line-height:1.12}
p{margin:0;color:var(--m);line-height:1.9;font-weight:800;max-width:70ch}

/* Controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14)}
.search input{width:100%;background:transparent;border:0;outline:none;color:var(--t);font-weight:900;font-family:inherit}
.search input::placeholder{color:rgba(234,240,255,.45)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{cursor:pointer;padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:rgba(234,240,255,.85);font-weight:900;transition:.2s}
.fbtn:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}
.fbtn.active{border:1px solid rgba(34,197,94,.40);background:rgba(34,197,94,.14)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 40px}
@media(max-width:980px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r2);background:rgba(255,255,255,.04);padding:16px;transition:.22s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-2px);background:rgba(255,255,255,.06)}
.thumb{height:170px;border-radius:18px;margin-bottom:12px;background:radial-gradient(12px 12px at 20% 30%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%),linear-gradient(135deg, rgba(34,197,94,.45), rgba(6,182,212,.45));border:1px solid rgba(255,255,255,.14);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.typeTag{font-weight:900;font-size:12px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(234,240,255,.88)}
.typeTag.web{border-color:rgba(6,182,212,.35);background:rgba(6,182,212,.14)}
.typeTag.app{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.14)}
.typeTag.store{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.14)}
.typeTag.security{border-color:rgba(168,85,247,.35);background:rgba(168,85,247,.14)}
.typeTag.travel{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.12)}
.typeTag.trading{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.12)}
.title{margin:0 0 6px;font-size:18px}
.desc{margin:0;color:var(--m);line-height:1.85;font-weight:800}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{font-weight:900;font-size:12px;color:rgba(234,240,255,.85);padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.hint{position:absolute;top:12px;left:12px;padding:8px 10px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);color:rgba(234,240,255,.92);font-weight:900;font-size:12px}

/* Modal */
.modalBack{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.60);display:none;align-items:center;justify-content:center;padding:18px}
.modalBack.show{display:flex}
.modal{width:min(980px,100%);border-radius:24px;border:1px solid rgba(255,255,255,.14);background:rgba(11,18,32,.92);box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:hidden}
.modalTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 0}
.modalTop h2{margin:0;font-size:22px}
.closeBtn{cursor:pointer;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--t);font-weight:900;border-radius:14px;padding:10px 12px;transition:.2s}
.closeBtn:hover{background:rgba(255,255,255,.10);transform:translateY(-1px)}
.modalBody{padding:16px;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
@media(max-width:900px){.modalBody{grid-template-columns:1fr}}
.modalImg{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);min-height:240px}
.modalImg img{width:100%;height:100%;object-fit:cover;display:block}
.modalInfo{border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.kvs{margin-top:10px;display:grid;gap:8px}
.kv{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:rgba(234,240,255,.92);font-weight:900;line-height:1.7}
.kv small{display:block;color:var(--m);font-weight:900}
.modalActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.modalActions a{display:inline-flex;align-items:center;gap:10px;padding:11px 14px;border-radius:999px;font-weight:900;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);transition:.2s}
.modalActions a:hover{background:rgba(255,255,255,.10);transform:translateY(-1px)}
.modalActions a.primary{border:0;color:#062012;background:linear-gradient(135deg,#34d399,#22c55e);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.modalActions a.call{border:0;color:#071019;background:linear-gradient(135deg,rgba(6,182,212,.95),rgba(34,197,94,.95));box-shadow:0 10px 30px rgba(0,0,0,.18)}

/* Footer */
footer{border-top:1px solid var(--line);padding:18px 0 28px;color:rgba(234,240,255,.78);font-weight:900}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="nav">
      <a class="brand" href="index.html">
        <span class="logoWrap"><img class="logo" src="https://i.ibb.co/B5BJ4hP7/1771369581658.png" alt="Nexus Logo"></span>
        <span>Nexus — Portfolio</span>
      </a>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end">
        <a class="pill" href="index.html#services">الخدمات</a>
        <a class="pill" href="index.html#contact">تواصل</a>
        <a class="btnCall btn" href="tel:+213671720653">📞 اتصال</a>
        <a class="btnPrimary btn" href="https://wa.me/213671720653" target="_blank">💬 واتساب</a>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <h1>Portfolio — أعمال Nexus</h1>
    <p>فلترة + بحث + نافذة تفاصيل. غيّر روابط المشاريع (url) والصور (img) لاحقاً لأعمالك الحقيقية.</p>
  </div>

  <div class="controls">
    <div class="search">🔎 <input id="q" type="text" placeholder="ابحث عن مشروع... مثال: travel أو landing أو security"></div>
    <div class="filters" id="filters">
      <button class="fbtn active" data-filter="all">All</button>
      <button class="fbtn" data-filter="web">Web</button>
      <button class="fbtn" data-filter="app">App</button>
      <button class="fbtn" data-filter="store">Store</button>
      <button class="fbtn" data-filter="travel">Travel</button>
      <button class="fbtn" data-filter="trading">Trading</button>
      <button class="fbtn" data-filter="security">Security</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>© <span id="y"></span> Nexus Service Online — All Rights Reserved</footer>
</div>

<!-- Modal -->
<div class="modalBack" id="modalBack" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalTop">
      <div>
        <h2 id="mTitle">Project</h2>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <span class="typeTag" id="mType">WEB</span>
          <span class="typeTag" id="mStatus">READY</span>
        </div>
      </div>
      <button class="closeBtn" id="closeModal">✕ إغلاق</button>
    </div>

    <div class="modalBody">
      <div class="modalImg"><img id="mImg" alt="Project Preview" src=""></div>
      <div class="modalInfo">
        <p id="mDesc" style="margin:0;color:rgba(234,240,255,.78);font-weight:900;line-height:1.9"></p>

        <div class="kvs">
          <div class="kv"><small>Tech / Notes</small><span id="mTech"></span></div>
          <div class="kv"><small>Highlights</small><span id="mHigh"></span></div>
        </div>

        <div class="tags" id="mTags"></div>

        <div class="modalActions">
          <a class="primary" id="mVisit" href="#" target="_blank">🚀 Visit Project</a>
          <a class="call" href="tel:+213671720653">📞 Call</a>
          <a href="https://wa.me/213671720653" target="_blank">💬 WhatsApp</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const PROJECTS = [
    {
      id:"p1", title:"Landing Page — Nexus", type:"web", status:"High Converting",
      desc:"صفحة هبوط احترافية مع CTA قوي ونموذج تواصل سريع.",
      tech:"HTML • CSS • JS", highlights:"CTA قوي • سرعة • Responsive",
      tags:["Landing","SEO","UI"],
      img:"https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1400&q=60",
      url:"https://algeriancitizen.github.io/NEXUS/"
    },
    {
      id:"p2", title:"Business Website", type:"web", status:"Corporate",
      desc:"موقع شركة منظم (خدمات + تواصل) مناسب للعلامات التجارية.",
      tech:"Modern UI • Mobile First", highlights:"هيكلة قوية • أقسام واضحة",
      tags:["Company","Brand","UX"],
      img:"https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1400&q=60",
      url:"#"
    },
    {
      id:"p3", title:"Dashboard / Admin Panel", type:"app", status:"Management",
      desc:"لوحة تحكم لإدارة البيانات والمتابعة.",
      tech:"Web App • Auth Ready", highlights:"تنظيم • قابل للتطوير",
      tags:["Dashboard","Admin","Secure"],
      img:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=60",
      url:"#"
    },
    {
      id:"p4", title:"E‑Commerce Store", type:"store", status:"Online Shop",
      desc:"نموذج متجر إلكتروني لتجربة شراء واضحة.",
      tech:"Store UI • Product Cards", highlights:"UX • جاهز للتطوير",
      tags:["Store","Products","UX"],
      img:"https://images.unsplash.com/photo-1515169067868-5387ec356754?auto=format&fit=crop&w=1400&q=60",
      url:"#"
    },
    {
      id:"p5", title:"Travel Planner — Itinerary", type:"travel", status:"Trip Plan",
      desc:"خطة رحلة يومية + اقتراح فنادق ووجهات حسب الميزانية.",
      tech:"Plan • Hotels • Tips", highlights:"برنامج يومي • ميزانية",
      tags:["Travel","Itinerary","Budget"],
      img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=60",
      url:"#"
    },
    {
      id:"p6", title:"Trading / Online Growth", type:"trading", status:"Growth",
      desc:"تحسين حضورك الرقمي وتجربة التحويل.",
      tech:"Conversion • UX • Setup", highlights:"Conversion • Strategy",
      tags:["Trading","Internet","Growth"],
      img:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=60",
      url:"#"
    },
    {
      id:"p7", title:"Cybersecurity Consulting", type:"security", status:"Protection",
      desc:"حماية حسابات وتفعيل 2FA ونصائح أمان للمشاريع.",
      tech:"2FA • Hardening • Policy", highlights:"Best Practices • حماية",
      tags:["Security","2FA","Consulting"],
      img:"https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1400&q=60",
      url:"#"
    }
  ];

  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  const filters = document.getElementById("filters");
  let activeFilter = "all";
  let searchText = "";

  function typeClass(t){
    if(t==="web") return "web";
    if(t==="app") return "app";
    if(t==="store") return "store";
    if(t==="security") return "security";
    if(t==="travel") return "travel";
    if(t==="trading") return "trading";
    return "";
  }
  function typeLabel(t){
    if(t==="web") return "WEB";
    if(t==="app") return "APP";
    if(t==="store") return "STORE";
    if(t==="security") return "SECURITY";
    if(t==="travel") return "TRAVEL";
    if(t==="trading") return "TRADING";
    return "PROJECT";
  }

  function render(){
    const list = PROJECTS.filter(p=>{
      const okFilter = activeFilter==="all" ? true : p.type===activeFilter;
      const hay = (p.title+" "+p.desc+" "+p.tags.join(" ")+" "+p.tech+" "+p.highlights).toLowerCase();
      const okSearch = searchText ? hay.includes(searchText) : true;
      return okFilter && okSearch;
    });

    grid.innerHTML = list.map(p=>`
      <div class="card" data-id="${p.id}">
        <div class="hint">اضغط للتفاصيل</div>
        <div class="thumb">${p.img ? `<img src="${p.img}" alt="${p.title}">` : ""}</div>
        <div class="meta">
          <span class="typeTag ${typeClass(p.type)}">${typeLabel(p.type)}</span>
          <span class="typeTag">${p.status}</span>
        </div>
        <h3 class="title">${p.title}</h3>
        <p class="desc">${p.desc}</p>
        <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
    `).join("");

    [...grid.querySelectorAll(".card")].forEach(c=>{
      c.addEventListener("click", ()=> openModal(c.getAttribute("data-id")));
    });
  }

  filters.addEventListener("click", (e)=>{
    const btn = e.target.closest(".fbtn");
    if(!btn) return;
    [...filters.querySelectorAll(".fbtn")].forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.getAttribute("data-filter");
    render();
  });

  q.addEventListener("input", ()=>{
    searchText = q.value.trim().toLowerCase();
    render();
  });

  // Modal
  const modalBack = document.getElementById("modalBack");
  const closeModal = document.getElementById("closeModal");
  const mTitle = document.getElementById("mTitle");
  const mType = document.getElementById("mType");
  const mStatus = document.getElementById("mStatus");
  const mDesc = document.getElementById("mDesc");
  const mTech = document.getElementById("mTech");
  const mHigh = document.getElementById("mHigh");
  const mTags = document.getElementById("mTags");
  const mImg  = document.getElementById("mImg");
  const mVisit= document.getElementById("mVisit");

  function openModal(id){
    const p = PROJECTS.find(x=>x.id===id);
    if(!p) return;
    mTitle.textContent = p.title;
    mType.textContent = typeLabel(p.type);
    mType.className = "typeTag " + typeClass(p.type);
    mStatus.textContent = p.status;
    mStatus.className = "typeTag";
    mDesc.textContent = p.desc;
    mTech.textContent = p.tech;
    mHigh.textContent = p.highlights;
    mTags.innerHTML = p.tags.map(t=>`<span class="tag">${t}</span>`).join("");
    mImg.src = p.img || "";
    mVisit.href = p.url || "#";
    modalBack.classList.add("show");
    modalBack.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }

  function hideModal(){
    modalBack.classList.remove("show");
    modalBack.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }

  closeModal.addEventListener("click", hideModal);
  modalBack.addEventListener("click", (e)=>{ if(e.target===modalBack) hideModal(); });
  window.addEventListener("keydown", (e)=>{ if(e.key==="Escape") hideModal(); });

  document.getElementById("y").textContent = new Date().getFullYear();
  render();
</script>
</body>
</html>
